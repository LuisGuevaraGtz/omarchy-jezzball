[package]
name = "jezzball-core"
description = "Pure, deterministic game logic for Omarchy-Jezzball: balls, walls, area partitioning and scoring. No I/O, no rendering."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
ron = "0.8"