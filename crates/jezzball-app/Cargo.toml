[package]
name = "jezzball-app"
description = "Rendering, input and persistence layer for Omarchy-Jezzball (macroquad)."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# The binary MUST be named `omarchy-jezzball`: the PKGBUILD and the .desktop
# entry expect exactly that name (packaging/PKGBUILD, package()).
[[bin]]
name = "omarchy-jezzball"
path = "src/main.rs"

[dependencies]
jezzball-core = { path = "../jezzball-core" }
macroquad = "0.4"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
toml = { version = "0.8", default-features = false, features = ["parse"] }
