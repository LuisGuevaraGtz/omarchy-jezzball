name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # macroquad/miniquad links against X11, ALSA and GL on Linux. CI has no
      # display, but the headers are still required to build.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev \
            libwayland-dev libxkbcommon-dev

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy (tests included)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --release --locked

      # The game needs a display, but `--help` does not: it works as a basic
      # smoke test that the binary starts and does not panic straight away.
      - name: Smoke test (--help with no display)
        run: ./target/release/omarchy-jezzball --help

      # A REAL startup test against a virtual display.
      #
      # This exists because `cargo test` and `--help` do NOT catch a binary
      # that fails to open a window: two startup regressions (a badly chosen
      # window backend and an `overflow-checks` setting that aborted the
      # process) passed both checks and only showed up while playing. Xvfb
      # starts the game for real, lets it run for a few seconds and fails if
      # the process dies or leaves a crash.log behind.
      - name: Virtual display dependencies
        run: sudo apt-get install -y --no-install-recommends xvfb

      - name: Real startup under Xvfb
        run: |
          set -euo pipefail
          rm -f "$HOME/.local/state/omarchy-jezzball/crash.log"
          xvfb-run -a --server-args="-screen 0 1024x768x24" \
            ./target/release/omarchy-jezzball &
          PID=$!
          sleep 8
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "ERROR: the game died during startup."
            cat "$HOME/.local/state/omarchy-jezzball/crash.log" 2>/dev/null || true
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          if [ -s "$HOME/.local/state/omarchy-jezzball/crash.log" ]; then
            echo "ERROR: the game logged a failure during startup:"
            cat "$HOME/.local/state/omarchy-jezzball/crash.log"
            exit 1
          fi
          echo "OK: the game started and stayed up."

      # The same startup check for both modes, which is how the .desktop file
      # launches the game.
      - name: Startup per mode (--mode)
        run: |
          set -euo pipefail
          for m in original enhanced; do
            rm -f "$HOME/.local/state/omarchy-jezzball/crash.log"
            xvfb-run -a --server-args="-screen 0 1024x768x24" \
              ./target/release/omarchy-jezzball --mode "$m" &
            PID=$!
            sleep 6
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "ERROR: --mode $m died on startup."
              cat "$HOME/.local/state/omarchy-jezzball/crash.log" 2>/dev/null || true
              exit 1
            fi
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            echo "OK: --mode $m started."
          done

      # Guard against Spanish creeping back into the published sources.
      # The Spanish UI catalogue (assets/i18n/es.ron) is excluded on purpose:
      # that file IS the translation.
      - name: No Spanish left in sources
        run: python3 tools/check_english.py
