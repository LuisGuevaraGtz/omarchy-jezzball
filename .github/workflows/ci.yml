name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cachear dependencias
        uses: Swatinem/rust-cache@v2

      # macroquad/miniquad enlaza con X11, ALSA y GL en Linux. En CI no hay
      # pantalla, pero sí hacen falta las cabeceras para compilar.
      - name: Dependencias de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev \
            libwayland-dev libxkbcommon-dev

      - name: Formato
        run: cargo fmt --all --check

      - name: Clippy (incluidos tests)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --release --locked

      # El juego necesita pantalla, pero `--help` no: sirve de humo básico
      # para detectar que el binario arranca y no panica antes de tiempo.
      - name: Humo (--help sin display)
        run: ./target/release/omarchy-jezzball --help

      # Prueba de arranque REAL con pantalla virtual.
      #
      # Existe porque `cargo test` y `--help` NO detectan un binario que no
      # abre ventana: dos regresiones de arranque (un backend de ventana mal
      # elegido y un `overflow-checks` que abortaba el proceso) pasaron ambas
      # comprobaciones y sólo se vieron al jugar. Xvfb arranca el juego de
      # verdad, lo deja correr unos segundos y falla si el proceso muere o si
      # deja un crash.log.
      - name: Dependencias de pantalla virtual
        run: sudo apt-get install -y --no-install-recommends xvfb

      - name: Arranque real bajo Xvfb
        run: |
          set -euo pipefail
          rm -f "$HOME/.local/state/omarchy-jezzball/crash.log"
          xvfb-run -a --server-args="-screen 0 1024x768x24" \
            ./target/release/omarchy-jezzball &
          PID=$!
          sleep 8
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "ERROR: el juego murio durante el arranque."
            cat "$HOME/.local/state/omarchy-jezzball/crash.log" 2>/dev/null || true
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          if [ -s "$HOME/.local/state/omarchy-jezzball/crash.log" ]; then
            echo "ERROR: el juego registro un fallo durante el arranque:"
            cat "$HOME/.local/state/omarchy-jezzball/crash.log"
            exit 1
          fi
          echo "OK: el juego arranco y se mantuvo en pie."

      # El mismo arranque con los dos modos, que es como lo lanza el .desktop.
      - name: Arranque por modo (--mode)
        run: |
          set -euo pipefail
          for m in original enhanced; do
            rm -f "$HOME/.local/state/omarchy-jezzball/crash.log"
            xvfb-run -a --server-args="-screen 0 1024x768x24" \
              ./target/release/omarchy-jezzball --mode "$m" &
            PID=$!
            sleep 6
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "ERROR: --mode $m murio al arrancar."
              cat "$HOME/.local/state/omarchy-jezzball/crash.log" 2>/dev/null || true
              exit 1
            fi
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            echo "OK: --mode $m arranco."
          done
