[workspace]
resolver = "2"
members = ["crates/jezzball-core", "crates/jezzball-app"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["Luis Guevara <luisguevaragtz@users.noreply.github.com>"]
repository = "https://github.com/LuisGuevaraGtz/omarchy-jezzball"
homepage = "https://github.com/LuisGuevaraGtz/omarchy-jezzball"
keywords = ["game", "jezzball", "omarchy", "wayland", "macroquad"]
categories = ["games"]
rust-version = "1.75"

# An integer overflow is always a logic bug, so we do want to catch it - but
# NOT at the cost of closing the game on the player.
#
# With `overflow-checks = true` in release, any overflow that previously went
# unnoticed (an odd counter, a HUD label) aborts the process. That turns a
# cosmetic defect into a lost game, and it is exactly what happened to this
# game right after it shipped.
#
# The split: tests and the debug profile DO check for overflow (that is where
# bugs get caught, and CI runs `cargo test`), while the distributed binary
# prioritises staying on its feet. The `release-checked` profile is available
# to debug a specific failure under release conditions:
#   cargo build --profile release-checked
[profile.release]
overflow-checks = false

[profile.release-checked]
inherits = "release"
overflow-checks = true
debug = true